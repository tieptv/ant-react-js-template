server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  # Handle root path (for K8s Ingress)
  location / {
    try_files $uri $uri/ @fallback;
    
    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico|webp)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }
  }

  # Handle /onboarding path (for local development)
  location = /onboarding {
    return 301 /onboarding/;
  }

  # Handle static assets under /onboarding
  location ~* ^/onboarding/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico|webp)$ {
    rewrite ^/onboarding/(.*)$ /$1 break;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /onboarding/ {
    try_files $uri @fallback;
  }

  # Fallback for SPA routing
  location @fallback {
    try_files /index.html =404;
  }
}