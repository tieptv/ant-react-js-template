server {
  listen 80;
  server_name localhost;

  location = /onboarding {
    return 301 /onboarding/;
  }

  location /onboarding/ {
    root /usr/share/nginx/html/;
    index index.html;
    try_files $uri $uri/ /onboarding/index.html;
  }

  location = /onboarding/favicon.ico {
    root /usr/share/nginx/html/;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
    root /usr/share/nginx/html/;
    access_log off;
    expires 30d;
  }
}