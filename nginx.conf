server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;

  location = /onboarding {
    return 301 /onboarding/;
  }

  # Handle static assets (including favicon)
  location ~* ^/onboarding/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico|webp)$ {
    # Strip /onboarding prefix for static files
    rewrite ^/onboarding/(.*)$ /$1 break;
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  location /onboarding/ {
    # Try to serve the file directly first
    try_files $uri @onboarding_fallback;
  }

  # Named location for onboarding fallback
  location @onboarding_fallback {
    # Serve index.html for all SPA routes
    try_files /index.html =404;
  }
}