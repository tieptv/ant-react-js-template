server {
    listen 80;
    server_name localhost;

    location /onboarding/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /onboarding/index.html;
    }

    location = /onboarding/favicon.png {
        root /usr/share/nginx/html;
    }

    location /onboarding/assets/ {
        root /usr/share/nginx/html;
    }
}
